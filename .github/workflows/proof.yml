name: Lean proof and native acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the pinned Lean toolchain (elan)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean/lean-toolchain)"
      - name: Cold build, axiom audit and generated-file checks in a bounded cgroup
        shell: bash
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" \
            --property=MemoryMax=7500000000 --property=MemorySwapMax=0 \
            --property=CPUQuota=800% --property=TasksMax=512 \
            --working-directory="$GITHUB_WORKSPACE" \
            --setenv=HOME="$HOME" --setenv=PATH="$HOME/.elan/bin:$PATH" \
            --setenv=GITHUB_ACTIONS=true \
            bash validation/ci/linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-proof-log
          if-no-files-found: ignore
          path: lake-build.log
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Preserve exact source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile SelfModTamper in Debug/Release x64 (the product needs admin and WinRing0 to run; compile-only)
        shell: pwsh
        run: |
          python validation/native.py --toolset v143
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  pmc-probe:
    # Builds the portable counter probe and runs its --selftest (the self-modifying loop executes; no counter is read).
    # Hosted runners are virtual machines without a PMU, so real counter data comes from bare-metal runs (validation/pmc/README.md).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure, build, self-test
        shell: bash
        run: |
          set -euo pipefail
          cmake -S validation/pmc -B pmc-build -DCMAKE_BUILD_TYPE=Release
          cmake --build pmc-build --config Release
          exe=$(find pmc-build -type f \( -name smc_pmc_probe -o -name smc_pmc_probe.exe \) | head -1)
          "$exe" --selftest --iters 20000 --reps 3
  posix-native:
    # The real benchmark and the evidence harness on Linux (x86-64): TP.asm is translated to GNU as by scripts/masm2gas.py and the
    # Lean-generated vectors are replayed against the static kernels. Hosted runners have no PMU, so counter columns read 0 here.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build, replay vectors, run the benchmark briefly
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B posix-build -DCMAKE_BUILD_TYPE=Release
          cmake --build posix-build
          (cd posix-build && ./smc_harness --vectors ../validation/native/vectors.txt | tail -8 && ./smc_harness --text | tail -3)
          (cd posix-build && timeout 120 ./SelfModTamper > bench.txt && grep -v '^MACHINE_CLEARS.SMC: [0-9]*$' bench.txt | head -40)
